name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Edits are pushed here straight from Google AI Studio. AI Studio may write its own
      # Firebase project (used by its preview) or drop the domain file; the live site must
      # always use the task-molly project and task-molly.com, so put those back before building.
      # The protected copies live in .github/live-config/ (change them there, not in the root files).
      - name: Keep live site settings
        run: |
          restore() {
            if ! cmp -s ".github/live-config/$2" "$1"; then
              echo "::warning::$1 differed from the live settings (probably an AI Studio push) - using the live version for this deploy"
              mkdir -p "$(dirname "$1")"
              cp ".github/live-config/$2" "$1"
            fi
          }
          restore firebase-applet-config.json firebase-applet-config.json
          restore CNAME CNAME
          restore public/CNAME CNAME
          node -e "const c=require('./firebase-applet-config.json'); if (c.projectId !== 'task-molly') { console.error('Live Firebase project is not task-molly'); process.exit(1); }"

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install react-is --legacy-peer-deps

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # AI Studio doesn't keep package-lock.json, so packages are downloaded fresh on every
      # deploy and a build can fail for reasons unrelated to the code. Retry once with a clean
      # install before giving up, so an AI Studio update isn't silently left undeployed.
      - name: Build
        run: |
          if npm run build; then exit 0; fi
          echo "::warning::Build failed - retrying once with a clean install"
          sleep 20
          rm -rf node_modules dist build
          npm install --legacy-peer-deps
          npm install react-is --legacy-peer-deps
          npm run build

      - name: Verify build artifacts
        run: |
          ls -la dist
          test -f dist/index.html || exit 1
          test -f dist/CNAME || { echo "::error::dist/CNAME missing - task-molly.com would stop pointing at this site"; exit 1; }
          grep -q '"task-molly"' -r dist/assets || { echo "::error::Build does not use the task-molly Firebase project"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
