name: Check pull request

# Builds and tests every pull request (and every push to a claude/ branch) before it is merged into main.
# (deploy.yml only runs after a merge, and deploys straight to the live site.)

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install react-is --legacy-peer-deps

      - name: Admin metrics unit tests
        run: npm run test:metrics

      - name: Type-check admin dashboard and Molly files
        # The whole project has older type errors, so only fail on errors in the admin dashboard files.
        run: |
          npx tsc --noEmit -p . > tsc.log 2>&1 || true
          echo "Type errors across the project: $(grep -c 'error TS' tsc.log || true)"
          if grep -E '^(admin/|src/(App\.tsx|pages/AdminDashboard|lib/(admin|adminMetrics|requestModel|serviceRequests|taskRef)|components/RequestCard)|src/pages/AdminComplaints|tests/(adminAccess|timeAgo|taskRef))' tsc.log; then
            echo "::error::Type errors in the admin dashboard files (listed above)"
            exit 1
          fi
          # Molly (AI concierge) files
          if grep -E '^(src/(services/geminiService|lib/molly|components/AIModal|pages/LandingPage)|tests/mollyResponse)' tsc.log | tee molly-tsc.log | grep -q .; then
            sed 's/^/::error::/' molly-tsc.log
            exit 1
          fi

      - name: Build
        run: npm run build

      # The separate admin website (admin/), deployed by Cloudflare Pages after merge.
      - name: Build admin site
        run: |
          npm run build:admin
          test -f admin/dist/index.html || exit 1
          grep -q '"task-molly"' -r admin/dist/assets || { echo "::error::Admin site does not use the task-molly Firebase project"; exit 1; }
          if grep -qE 'Operations dashboard|admin-complaints' -r dist/assets; then
            echo "::error::Admin screens ended up in the customer/provider app"
            exit 1
          fi

      # Same checks deploy.yml makes before publishing, so a change that would block the deploy fails here first.
      - name: Check the build is wired to the live site
        run: |
          test -f dist/CNAME || { echo "::error::dist/CNAME missing - task-molly.com would stop pointing at this site"; exit 1; }
          grep -q '"task-molly"' -r dist/assets || { echo "::error::Build does not use the task-molly Firebase project"; exit 1; }
          cmp -s firebase-applet-config.json .github/live-config/firebase-applet-config.json || echo "::warning::firebase-applet-config.json differs from .github/live-config/ - the deploy will use the live copy"
